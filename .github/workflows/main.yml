name: "HAMED IRANOSH | Android APK Builder"

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: "Build IRANOSH APK"
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: "Checkout Project"
        uses: actions/checkout@v4

      - name: "Install Java 17"
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: "Install Android SDK"
        uses: android-actions/setup-android@v3

      - name: "Install Android SDK Packages"
        shell: bash
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: "Install Gradle 8.7"
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: "Check Android Project"
        shell: bash
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          echo "Android project files verified."

      - name: "Build Debug APK"
        shell: bash
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: "Upload APK"
        uses: actions/upload-artifact@v4
        with:
          name: HAMED-IRANOSH-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
