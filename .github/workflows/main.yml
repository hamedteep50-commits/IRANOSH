name: Build HAMED IRANOSH APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Extract Android source if needed
        shell: bash
        run: |
          if ! find . -type f -name gradlew \
            -not -path '*/.gradle/*' | grep -q .; then
            ZIP="$(find . -type f -iname '*.zip' | head -n 1)"
            if [ -z "$ZIP" ]; then
              echo "::error::No gradlew or source ZIP found. Upload the Android source ZIP to the repository."
              echo "Repository contents:"
              find . -maxdepth 3 -type f | head -100
              exit 1
            fi
            mkdir -p extracted-source
            unzip -oq "$ZIP" -d extracted-source
          fi

      - name: Locate Gradle project
        id: project
        shell: bash
        run: |
          WRAPPER="$(find . -type f -name gradlew \
            -not -path '*/.gradle/*' | head -n 1)"
          if [ -z "$WRAPPER" ]; then
            echo "::error::gradlew missing from extracted source ZIP"
            find . -maxdepth 4 -type f | head -150
            exit 1
          fi
          echo "project_dir=$(dirname "$WRAPPER")" >> "$GITHUB_OUTPUT"

      - name: Build APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HAMED-IRANOSH-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
