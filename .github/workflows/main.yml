name: Build HAMED IRANOSH APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Locate Gradle project
        id: project
        shell: bash
        run: |
          WRAPPER="$(find . -type f -name gradlew \
            -not -path '*/.gradle/*' | head -n 1)"
          if [ -z "$WRAPPER" ]; then
            echo "::error::gradlew not found in repository"
            exit 1
          fi
          PROJECT_DIR="$(dirname "$WRAPPER")"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project found: $PROJECT_DIR"

      - name: Build APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HAMED-IRANOSH-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
