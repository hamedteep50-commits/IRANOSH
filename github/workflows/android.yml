name: IRANOSH Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android.yml'
      - '*.zip'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract Iranosh source
        shell: bash
        run: |
          set -euo pipefail
          ZIP="HAMED_IRANOSH_READY_TO_UPLOAD.zip"
          test -f "$ZIP" || {
            echo "ERROR: $ZIP not found in repository root"
            exit 1
          }
          mkdir -p source
          unzip -q "$ZIP" -d source
          ROOT="$(find source -type f \
            \( -name gradlew -o -name build.gradle \
            -o -name build.gradle.kts \) \
            -printf '%h\n' | head -n 1)"
          test -n "$ROOT" || {
            echo "ERROR: No Gradle project found in ZIP"
            exit 1
          }
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Found project at: $ROOT"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            echo "ERROR: Gradle wrapper missing"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IRANOSH-Android-APK
          path: source/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
